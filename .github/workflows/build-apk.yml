name: Build CandlePro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Extract project ZIP
        run: |
          unzip -o CandleProMobileV2_APK_Builder_Tanpa_Android_Studio.zip -d extracted
          ls -la extracted/CandleProMobileV2

      - name: Build APK
        run: |
          cd extracted/CandleProMobileV2
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandleProMobileV2-APK
          path: extracted/CandleProMobileV2/app/build/outputs/apk/debug/app-debug.apk
