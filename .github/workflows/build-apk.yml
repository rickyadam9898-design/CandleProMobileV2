
      - name: Fix Java and Kotlin JVM targets
        run: |
          cd extracted/CandleProMobileV2
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("app/build.gradle"),
              Path("app/build.gradle.kts")
          ]

          gradle_file = next(
              (p for p in candidates if p.exists()), None
          )

          if gradle_file is None:
              raise SystemExit("File Gradle tidak ditemukan")

          source = gradle_file.read_text(encoding="utf-8")

          # Perbaiki target Java
          source = source.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )
          source = source.replace(
              "VERSION_1_8",
              "VERSION_17"
          )

          # Perbaiki Kotlin JVM Target jika sudah tersedia
          source = source.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )
          source = source.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          gradle_file.write_text(source, encoding="utf-8")

          print("Gradle file:", gradle_file)
          print("Java/Kotlin target diperiksa.")
          print(source)
          PY
