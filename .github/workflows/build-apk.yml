
      - name: Fix Java and Kotlin JVM targets
        run: |
          cd extracted/CandleProMobileV2
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("app/build.gradle"),
              Path("app/build.gradle.kts")
          ]

          gradle_file = next(
              (p for p in candidates if p.exists()), None
          )

          if gradle_file is None:
              raise SystemExit("File app/build.gradle tidak ditemukan")

          source = gradle_file.read_text(encoding="utf-8")

          # Ganti target Java 1.8 jika ditemukan
          fixed = source.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )
          fixed = fixed.replace(
              "VERSION_1_8",
              "VERSION_17"
          )

          # Jangan hentikan build hanya karena Java 1.8 tidak ditemukan
          gradle_file.write_text(fixed, encoding="utf-8")

          print("Konfigurasi Gradle berhasil diperiksa:")
          print(gradle_file)
          print(fixed)

          PY
